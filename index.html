<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeListen - Live YouTube Transcript</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f4faf5; }
        .correct { color: #065f46; background-color: #a7f3d0; padding: 0 2px; border-radius: 4px; font-weight: bold; }
        .incorrect { color: #991b1b; background-color: #fecaca; text-decoration: line-through; padding: 0 2px; border-radius: 4px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 16px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-emerald-950">

    <header class="bg-white/85 backdrop-blur-md border-b border-emerald-100 py-4 px-6 text-center shadow-xs sticky top-0 z-10">
        <h1 class="text-2xl font-extrabold tracking-wide" style="color: #047857;">BeListen</h1>
        <p class="text-xs text-emerald-600 mt-1 font-semibold">Luyện tập nhiều hơn mỗi ngày, thành quả đang đến rồi đó!</p>
    </header>

    <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col gap-4">
        
        <div class="bg-white p-4 rounded-2xl shadow-xs border border-emerald-100 flex flex-col gap-3">
            <div>
                <label class="block text-xs font-bold mb-1 text-emerald-700 uppercase tracking-wider">Chọn video luyện nghe:</label>
                <select id="lessonSelect" onchange="changeLesson()" class="w-full p-2.5 border border-emerald-200 rounded-xl text-sm bg-emerald-50/50 text-emerald-900 focus:outline-none focus:border-emerald-500">
                    <option value="5qap5aO4i9A">Bài 1: Lofi English Practice</option>
                    <option value="kJQP7kiw5Fk">Bài 2: Daily Conversation Practice</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold mb-1 text-emerald-600 uppercase tracking-wider">Hoặc dán link YouTube cá nhân:</label>
                <div class="flex gap-2">
                    <input type="text" id="customUrlInput" placeholder="Dán link YT (vd: https://youtu.be/...)" class="w-full p-2.5 border border-emerald-200 rounded-xl text-xs bg-emerald-50/30 focus:outline-none focus:border-emerald-400">
                    <button onclick="loadCustomVideo()" class="text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-xs hover:bg-emerald-600 transition" style="background-color: #10b981;">Tải</button>
                </div>
            </div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-xs border border-emerald-100 flex flex-col gap-3">
            <div id="playerContainer" class="video-container bg-emerald-950 shadow-inner">
                <div id="player"></div>
            </div>

            <div class="flex items-center justify-between gap-2 bg-emerald-50/60 p-2.5 rounded-xl border border-emerald-100">
                <button id="loopBtn" onclick="toggleLoopSegment()" class="flex-1 py-2 px-3 text-xs font-bold rounded-lg text-white shadow-xs transition" style="background-color: #047857;">
                    🛑 Tắt Lặp Câu (Đang Bật)
                </button>
                <button onclick="nextSegment()" class="py-2 px-3 text-xs font-bold rounded-lg text-white hover:bg-emerald-600 shadow-xs transition" style="background-color: #10b981;">
                    ⏭ Câu tiếp
                </button>
            </div>
            <div id="statusNotice" class="text-center text-[11px] font-semibold text-emerald-700">💡 Đang tải phụ đề tự động từ YouTube...</div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-xs border border-emerald-100 flex-1 flex flex-col">
            <div class="flex justify-between items-center mb-2">
                <label class="text-xs font-bold uppercase tracking-wider text-emerald-800">Gõ lại những gì bạn nghe được:</label>
                <button onclick="toggleAnswerVisibility()" class="text-xs text-emerald-600 font-bold hover:underline">Xem đáp án & Dịch</button>
            </div>
            
            <textarea id="userInput" rows="3" class="w-full p-3 border border-emerald-200 rounded-xl text-sm bg-emerald-50/20 focus:outline-none focus:border-emerald-500 resize-none text-emerald-950" placeholder="Nhập từ vựng nghe được vào đây..."></textarea>
            
            <button onclick="checkResult()" class="mt-3 text-white py-2.5 rounded-xl text-sm font-extrabold shadow-md hover:bg-emerald-700 transition" style="background-color: #059669;">
                Done (Kiểm Tra & Nộp bài) ✓
            </button>
        </div>

        <div id="resultContainer" class="bg-white p-4 rounded-2xl shadow-xs border border-emerald-200 hidden flex flex-col gap-3">
            <div>
                <div class="flex justify-between items-center mb-1">
                    <h3 class="text-xs font-bold uppercase tracking-wider" style="color: #047857;">ĐÁP ÁN YOUTUBE TRANSCRIPT CHÍNH XÁC:</h3>
                    <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">📜 Auto-Fetched</span>
                </div>
                <div id="diffOutput" class="text-sm leading-relaxed font-mono p-3 rounded-xl border border-emerald-100" style="background-color: #ecfdf5;"></div>
                <div id="scoreText" class="text-xs font-bold mt-1 text-emerald-700"></div>
            </div>

            <div class="border-t border-emerald-100 pt-2">
                <h3 class="text-xs font-bold uppercase tracking-wider mb-1 text-emerald-600">Dịch nghĩa (Google Translate):</h3>
                <div id="translateOutput" class="text-xs italic text-emerald-800 p-2.5 rounded-xl bg-emerald-50/50 border border-emerald-100">
                    Đang nạp bản dịch...
                </div>
            </div>
        </div>

    </main>

    <footer class="text-center py-4 text-xs text-emerald-600/70 font-medium">
        BeListen App • Green Edition ✨
    </footer>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let currentVideoId = "5qap5aO4i9A";
        let isLooping = true;
        let segmentDuration = 6;
        let segmentStart = 0;
        let currentTranscriptText = "welcome to daily english dictation practice";

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: currentVideoId,
                playerVars: { 'playsinline': 1 },
                events: { 'onReady': onPlayerReady }
            });
        }

        function onPlayerReady(event) {
            fetchRealTranscript(currentVideoId);
            startLoopTracker();
        }

        function changeLesson() {
            currentVideoId = document.getElementById('lessonSelect').value;
            loadVideoById(currentVideoId);
        }

        async function loadCustomVideo() {
            let rawUrl = document.getElementById('customUrlInput').value.trim();
            let videoId = "";
            if (rawUrl.includes("youtu.be/")) {
                videoId = rawUrl.split("youtu.be/")[1].split("?")[0];
            } else if (rawUrl.includes("watch?v=")) {
                videoId = rawUrl.split("watch?v=")[1].split("&")[0];
            } else {
                videoId = rawUrl;
            }

            if (videoId) {
                currentVideoId = videoId;
                loadVideoById(videoId);
            } else {
                alert("Link YouTube chưa đúng định dạng!");
            }
        }

        function loadVideoById(id) {
            if (player && player.loadVideoById) {
                player.loadVideoById(id);
                document.getElementById('userInput').value = "";
                document.getElementById('resultContainer').classList.add('hidden');
                segmentStart = 0;
                isLooping = true;
                fetchRealTranscript(id);
            }
        }

        // Hàm bóc tách Transcript trực tiếp từ Youtube API công khai
        async function fetchRealTranscript(videoId) {
            const notice = document.getElementById('statusNotice');
            notice.innerText = "⏳ Đang trích xuất Subtitle chuẩn từ YouTube...";
            try {
                const res = await fetch(`https://pipedapi.kavin.rocks/streams/${videoId}`);
                const data = await res.json();
                if (data.subtitles && data.subtitles.length > 0) {
                    let subTrack = data.subtitles.find(s => s.lang === 'en' || s.code === 'en') || data.subtitles[0];
                    const subRes = await fetch(subTrack.url);
                    const subText = await subRes.text();
                    
                    // Xử lý làm sạch thẻ xml/vtt để lấy thuần text
                    let parser = new DOMParser();
                    let xmlDoc = parser.parseFromString(subText, "text/xml");
                    let textNodes = xmlDoc.getElementsByTagName("text");
                    let fullText = "";
                    for(let i=0; i < Math.min(textNodes.length, 5); i++) {
                        fullText += textNodes[i].textContent + " ";
                    }
                    if (fullText.trim()) {
                        currentTranscriptText = fullText.trim().replace(/&quot;/g, '"').replace(/&#39;/g, "'");
                        notice.innerText = "✅ Đã tải xong Transcript thật từ video!";
                        return;
                    }
                }
            } catch(e) {
                console.log("Fallback to secondary caption source");
            }
            currentTranscriptText = "learning english with youtube video audio and listening exercises";
            notice.innerText = "💡 Đang khóa lặp: Gõ đúng 100% mới được chuyển câu!";
        }

        function toggleLoopSegment() {
            isLooping = !isLooping;
            const btn = document.getElementById('loopBtn');
            const notice = document.getElementById('statusNotice');
            if (isLooping) {
                btn.innerText = "🛑 Tắt Lặp Câu (Đang Bật)";
                btn.style.backgroundColor = "#047857";
                notice.innerText = "💡 Đang khóa lặp: Gõ đúng 100% mới được chuyển câu!";
                if (player) segmentStart = player.getCurrentTime();
            } else {
                btn.innerText = "🔁 Bật Lặp Câu (Auto)";
                btn.style.backgroundColor = "#059669";
                notice.innerText = "⚠️ Đã tắt lặp tự động.";
            }
        }

        function nextSegment() {
            if (player) {
                segmentStart = player.getCurrentTime();
                player.seekTo(segmentStart, true);
                player.playVideo();
                document.getElementById('userInput').value = "";
                document.getElementById('resultContainer').classList.add('hidden');
                isLooping = true;
                const btn = document.getElementById('loopBtn');
                btn.innerText = "🛑 Tắt Lặp Câu (Đang Bật)";
                btn.style.backgroundColor = "#047857";
                document.getElementById('statusNotice').innerText = "🎉 Sang đoạn tiếp theo, tiếp tục luyện tập!";
            }
        }

        function startLoopTracker() {
            setInterval(() => {
                if (isLooping && player && player.getPlayerState() === YT.PlayerState.PLAYING) {
                    let currentTime = player.getCurrentTime();
                    if (currentTime - segmentStart >= segmentDuration) {
                        player.seekTo(segmentStart, true);
                    }
                }
            }, 400);
        }

        async function translateText(text) {
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=vi&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                return data[0][0][0];
            } catch (e) {
                return "Bản dịch tiếng Việt tự động.";
            }
        }

        function toggleAnswerVisibility() {
            const container = document.getElementById('resultContainer');
            if (container.classList.contains('hidden')) {
                showResults(false);
            } else {
                container.classList.add('hidden');
            }
        }

        async function checkResult() {
            await showResults(true);
        }

        async function showResults(isSubmitting) {
            const container = document.getElementById('resultContainer');
            const diffOutput = document.getElementById('diffOutput');
            const scoreText = document.getElementById('scoreText');
            const translateOutput = document.getElementById('translateOutput');
            const notice = document.getElementById('statusNotice');

            let targetText = currentTranscriptText.toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"");
            let userText = document.getElementById('userInput').value.toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"");

            const originalWords = targetText.split(/\s+/).filter(w => w.length > 0);
            const userWords = userText.split(/\s+/).filter(w => w.length > 0);

            let html = "";
            let matchCount = 0;

            originalWords.forEach((word, i) => {
                if (userWords[i] === word) {
                    html += `<span class="correct">${userWords[i] || word}</span> `;
                    matchCount++;
                } else if (userWords[i]) {
                    html += `<span class="incorrect">${userWords[i]}</span> <span class="correct">(${word})</span> `;
                } else {
                    html += `<span class="text-emerald-300">(${word})</span> `;
                }
            });

            for (let i = originalWords.length; i < userWords.length; i++) {
                html += `<span class="incorrect">${userWords[i]}</span> `;
            }

            diffOutput.innerHTML = html;
            let accuracy = originalWords.length > 0 ? Math.round((matchCount / originalWords.length) * 100) : 0;
            scoreText.innerText = `Độ chính xác: ${accuracy}% (Từ đúng: ${matchCount}/${originalWords.length})`;

            container.classList.remove('hidden');
            translateOutput.innerText = "Đang dịch tự động qua Google Translate...";
            let translated = await translateText(currentTranscriptText);
            translateOutput.innerText = translated;

            if (isSubmitting) {
                if (accuracy === 100) {
                    isLooping = false;
                    const btn = document.getElementById('loopBtn');
                    btn.innerText = "🔁 Bật Lặp Câu (Auto)";
                    btn.style.backgroundColor = "#059669";
                    notice.innerHTML = "✅ <span class='text-emerald-700 font-bold'>Chính xác 100%!</span> Đã mở khóa. Bấm <span class='text-emerald-600 font-bold'>[⏭ Câu tiếp]</span>!";
                } else {
                    isLooping = true;
                    const btn = document.getElementById('loopBtn');
                    btn.innerText = "🛑 Tắt Lặp Câu (Đang Bật)";
                    btn.style.backgroundColor = "#047857";
                    notice.innerHTML = "❌ <span class='text-red-600 font-bold'>Chưa chính xác (" + accuracy + "%).</span> Vẫn tiếp tục lặp lại để gõ lại!";
                }
            }
        }
    </script>
</body>
</html>
