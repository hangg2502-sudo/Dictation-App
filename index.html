<!DOCTYPE html>
<html lang="vi">
<head>

    <title>BeListen - Zootopia Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f4faf5; }

        .incorrect { color: #991b1b; background-color: #fecaca; text-decoration: line-through; padding: 0 2px; border-radius: 4px; }
        
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 16px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
