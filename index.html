<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeListen - Fixed Navigation Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f4faf5; }
        .correct { color: #065f46; background-color: #a7f3d0; padding: 0 2px; border-radius: 4px; font-weight: bold; }
        .incorrect { color: #991b1b; background-color: #fecaca; text-decoration: line-through; padding: 0 2px; border-radius: 4px; }
        
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 16px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-emerald-950">

    <!-- Header BeListen -->
    <header class="bg-white/85 backdrop-blur-md border-b border-emerald-100 py-4 px-6 text-center shadow-xs sticky top-0 z-10 flex justify-between items-center">
        <button id="backBtn" onclick="goBack()" class="hidden text-xs font-bold text-emerald-700 bg-emerald-100 hover:bg-emerald-200 px-3 py-1.5 rounded-lg transition">
            ⬅ Quay lại
        </button>
        <div class="flex-1 text-center">
            <h1 class="text-2xl font-extrabold tracking-wide" style="color: #047857;">BeListen</h1>
            <p id="headerSubtitle" class="text-xs text-emerald-600 font-semibold">Nghe Nghe Nghe thì mới nghe tốt !!!</p>
        </div>
        <div class="w-12"></div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col gap-4">

        <!-- ================= TRANG 1: DANH SÁCH CHỦ ĐỀ ================= -->
        <div id="viewTopics" class="flex flex-col gap-3">
            <h2 class="text-xs font-bold uppercase tracking-wider text-emerald-800 mb-1">Chủ đề bài học:</h2>
            
            <!-- Chủ đề 1: Zootopia -->
            <button onclick="openTopic('Zootopia')" class="bg-white p-4 rounded-2xl shadow-xs border border-emerald-100 flex items-center justify-between hover:border-emerald-400 hover:shadow-sm transition text-left group">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-100 flex items-center justify-center text-emerald-700 font-extrabold text-lg">
                        🦊
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-emerald-950 group-hover:text-emerald-700">Zootopia</h3>
                        <p class="text-[11px] text-emerald-600">Luyện nghe qua trích đoạn phim Zootopia</p>
                    </div>
                </div>
                <span class="text-emerald-400 font-bold text-sm">▶</span>
            </button>

            <!-- Chủ đề 2: Harry Potter -->
            <button onclick="openTopic('Harry Potter')" class="bg-white p-4 rounded-2xl shadow-xs border border-emerald-100 flex items-center justify-between hover:border-emerald-400 hover:shadow-sm transition text-left group">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-amber-100 flex items-center justify-center text-amber-700 font-extrabold text-lg">
                        🧙‍♂️
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-emerald-950 group-hover:text-emerald-700">Harry Potter</h3>
                        <p class="text-[11px] text-emerald-600">Luyện nghe các phân cảnh huyền thoại trong Harry Potter</p>
                    </div>
                </div>
                <span class="text-emerald-400 font-bold text-sm">▶</span>
            </button>
        </div>

        <!-- ================= TRANG 2: DANH SÁCH VIDEO CỐ ĐỊNH ================= -->
        <div id="viewVideos" class="hidden flex flex-col gap-3">
            <h2 id="topicTitleHeader" class="text-xs font-bold uppercase tracking-wider text-emerald-800 mb-1">Danh sách Video:</h2>
            
            <div id="videoListContainer" class="flex flex-col gap-2.5">
                <!-- Nội dung danh sách video sẽ tự nạp theo chủ đề được chọn -->
            </div>
        </div>

        <!-- ================= TRANG 3: MÀN HÌNH LUYỆN NGHE & CHÉP CHÍNH TẢ ================= -->
        <div id="viewPractice" class="hidden flex-1 flex flex-col gap-4">
            
            <!-- YouTube Player -->
            <div class="bg-white p-4 rounded-2xl shadow-xs border border-emerald-100 flex flex-col gap-3">
                <h3 id="currentLessonTitle" class="text-xs font-bold text-emerald-800 truncate">Tên Video</h3>
                
                <div class="video-container bg-emerald-950 shadow-inner relative">
                    <div id="player"></div>
                </div>

                <!-- Điều khiển lặp câu -->
                <div class="flex items-center justify-between gap-2 bg-emerald-50/60 p-2.5 rounded-xl border border-emerald-100">
                    <button id="loopBtn" onclick="toggleLoopSegment()" class="flex-1 py-2 px-3 text-xs font-bold rounded-lg text-white shadow-xs transition" style="background-color: #047857;">
                        🛑 Tắt Lặp Câu (Đang Bật)
                    </button>
                    <button onclick="nextSegment()" class="py-2 px-3 text-xs font-bold rounded-lg text-white hover:bg-emerald-600 shadow-xs transition" style="background-color: #10b981;">
                        ⏭ Câu tiếp
                    </button>
                </div>
                <div id="statusNotice" class="text-center text-[11px] font-semibold text-emerald-700">💡 Gõ đúng 100% để qua câu tiếp theo (hoặc bấm phím Enter để Check nhanh)!</div>
            </div>

            <!-- Khung Nhập Liệu -->
            <div class="bg-white p-4 rounded-2xl shadow-xs border border-emerald-100 flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-emerald-800">
                        Đoạn <span id="currentSegmentIdx">1</span>/<span id="totalSegmentsIdx">1</span> - Viết cả câu vào đêi:
                    </label>
                    <button onclick="toggleAnswerVisibility()" class="text-xs text-emerald-600 font-bold hover:underline">Xem đáp án & Dịch</button>
                </div>
                
                <textarea id="userInput" rows="3" onkeydown="handleTextareaKey(event)" class="w-full p-3 border border-emerald-200 rounded-xl text-sm bg-emerald-50/20 focus:outline-none focus:border-emerald-500 resize-none text-emerald-950" placeholder="Nhập câu tiếng Anh nghe được vào đây (bấm Enter để Check)..."></textarea>
                
                <button onclick="checkResult()" class="mt-3 text-white py-2.5 rounded-xl text-sm font-extrabold shadow-md hover:bg-emerald-700 transition" style="background-color: #059669;">
                    Check ✓
                </button>
            </div>

            <!-- Khung Đáp Án Đối Chiếu & Dịch -->
            <div id="resultContainer" class="bg-white p-4 rounded-2xl shadow-xs border border-emerald-200 hidden flex flex-col gap-3">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <h3 class="text-xs font-bold uppercase tracking-wider" style="color: #047857;">ĐÁP ÁN:</h3>
                        <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">📊 Chấm tự động</span>
                    </div>
                    <div id="diffOutput" class="text-sm font-medium p-3 rounded-xl border border-emerald-100 text-emerald-950" style="background-color: #ecfdf5;"></div>
                    <div id="scoreText" class="text-xs font-bold mt-1 text-emerald-700"></div>
                </div>

                <div class="border-t border-emerald-100 pt-2">
                    <h3 class="text-xs font-bold uppercase tracking-wider mb-1 text-emerald-600">Dịch tự động, tham khảo thôi nhớ!</h3>
                    <div id="translateOutput" class="text-xs italic text-emerald-800 p-2.5 rounded-xl bg-emerald-50/50 border border-emerald-100">
                        Đang nạp bản dịch...
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-emerald-600/70 font-medium">
        BeListen made by Bel ✨
    </footer>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let currentView = 1;
        let transcriptSegments = []; 
        let currentSegmentIndex = 0;

        let player = null;
        let isLooping = true;
        let segmentStart = 0;
        let segmentEnd = 0;

        function onYouTubeIframeAPIReady() {}

        function setView(viewNum) {
            currentView = viewNum;
            document.getElementById('viewTopics').classList.toggle('hidden', viewNum !== 1);
            document.getElementById('viewVideos').classList.toggle('hidden', viewNum !== 2);
            document.getElementById('viewPractice').classList.toggle('hidden', viewNum !== 3);
            document.getElementById('backBtn').classList.toggle('hidden', viewNum === 1);

            const subtitle = document.getElementById('headerSubtitle');
            subtitle.innerText = "Nghe Nghe Nghe thì mới nghe tốt !!!";
        }

        function goBack() {
            if (currentView === 3) setView(2);
            else if (currentView === 2) setView(1);
        }

        function openTopic(topicName) {
            setView(2);
            const container = document.getElementById('videoListContainer');
            const header = document.getElementById('topicTitleHeader');
            
            if (topicName === 'Zootopia') {
                header.innerText = "Danh sách Video - Zootopia:";
                container.innerHTML = `
                    <button onclick="startPractice('Zootopia - Judy\'s Hustle (Tax Evasion)', 'J9MKjQ6-UBU', 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQU9tUvOG7EkQzPg5kmFttgYc8v4PoHY_ly0BWxnNpCrRbP4A_CLaK21UTbRYTwVVVbhuqNsALLfQUA/pub?output=csv')" class="bg-white p-3.5 rounded-xl border border-emerald-100 flex items-center justify-between text-left hover:border-emerald-400 hover:bg-emerald-50/30 transition shadow-xs w-full">
                        <div class="flex items-center gap-3">
                            <span class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold flex items-center justify-center">1</span>
                            <span class="text-xs font-bold text-emerald-950">1. Zootopia - Judy's Hustle</span>
                        </div>
                        <span class="text-xs text-emerald-600 font-bold">Học ngay ➔</span>
                    </button>
                `;
            } else if (topicName === 'Harry Potter') {
                header.innerText = "Nón phân loại - Harry Potter 1";
                container.innerHTML = `
                    <button onclick="startPractice('Nón phân loại - Harry Potter 1', 'z4K2F_OALPQ', 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQTB4HbLMtGm5lxt1CacI1wXGaAyEyhosNtoYJ7KxT6i3E4AYSqWEkZ7SkcMUtprZC1gEyYxS1GYP3j/pub?gid=0&single=true&output=csv')" class="bg-white p-3.5 rounded-xl border border-emerald-100 flex items-center justify-between text-left hover:border-emerald-400 hover:bg-emerald-50/30 transition shadow-xs w-full">
                        <div class="flex items-center gap-3">
                            <span class="w-6 h-6 rounded-full bg-amber-100 text-amber-800 text-xs font-bold flex items-center justify-center">1</span>
                            <span class="text-xs font-bold text-emerald-950">Nón phân loại - Harry Potter 1</span>
                        </div>
                        <span class="text-xs text-emerald-600 font-bold">Học ngay ➔</span>
                    </button>
                `;
            }
        }

        async function startPractice(lessonTitle, videoId, csvUrl) {
            setView(3);
            document.getElementById('currentLessonTitle').innerText = lessonTitle;

            loadYouTubePlayer(videoId);

            try {
                const res = await fetch(csvUrl);
                const csvText = await res.text();
                parseTranscriptFromSheet(csvText);
            } catch (e) {
                transcriptSegments = [{ startTime: 0, endTime: 6, text: "welcome to belisten app practice", isSilent: false }];
                updateSegmentUI();
            }
        }

        function parseTimeToSeconds(timeStr) {
            if (!timeStr) return 0;
            let parts = timeStr.trim().split(':');
            if (parts.length === 2) {
                return parseInt(parts[0]) * 60 + parseInt(parts[1]);
            } else if (parts.length === 1) {
                return parseInt(parts[0]);
            }
            return 0;
        }

        function parseTranscriptFromSheet(csvText) {
            const rawLines = csvText.split(/\r?\n/);
            transcriptSegments = [];

            rawLines.forEach(line => {
                if (!line.trim()) return;
                
                let match = line.match(/\[\s*([\d:]+)\s*-\s*([\d:]+)\s*\]\s*-?\s*(.*)/);
                if (match) {
                    let startTime = parseTimeToSeconds(match[1]);
                    let endTime = parseTimeToSeconds(match[2]);
                    let text = match[3].replace(/^["']|["']$/g, '').trim();

                    if (text.length > 0) {
                        let isSilent = text === "***";
                        transcriptSegments.push({
                            startTime: startTime,
                            endTime: endTime > startTime ? endTime : startTime + 5,
                            text: text,
                            isSilent: isSilent
                        });
                    }
                }
            });

            if (transcriptSegments.length === 0) {
                transcriptSegments = [{ startTime: 0, endTime: 6, text: "welcome to practice listening and dictation", isSilent: false }];
            }

            currentSegmentIndex = 0;
            updateSegmentUI();
        }

        function updateSegmentUI() {
            let seg = transcriptSegments[currentSegmentIndex];
            
            if (seg && seg.isSilent) {
                document.getElementById('statusNotice').innerText = "🎵 Đoạn nhạc/khoảng lặng - Đang phát tự động qua câu tiếp theo...";
                document.getElementById('userInput').value = "";
                document.getElementById('resultContainer').classList.add('hidden');
                
                if (player && typeof player.seekTo === 'function') {
                    segmentStart = seg.startTime;
                    segmentEnd = seg.endTime;
                    player.seekTo(segmentStart, true);
                    player.playVideo();
                    isLooping = false;
                }
                return;
            }

            document.getElementById('currentSegmentIdx').innerText = currentSegmentIndex + 1;
            document.getElementById('totalSegmentsIdx').innerText = transcriptSegments.length;
            document.getElementById('userInput').value = "";
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('statusNotice').innerText = "💡 Đang lặp đúng mốc thời gian: Gõ đúng 100% để qua câu tiếp theo!";

            if (player && typeof player.seekTo === 'function' && seg) {
                segmentStart = seg.startTime;
                segmentEnd = seg.endTime;
                player.seekTo(segmentStart, true);
                player.playVideo();
                isLooping = true;
                const btn = document.getElementById('loopBtn');
                btn.innerText = "🛑 Tắt Lặp Câu (Đang Bật)";
                btn.style.backgroundColor = "#047857";
            }
        }

        function loadYouTubePlayer(videoId) {
            if (!player) {
                player = new YT.Player('player', {
                    videoId: videoId,
                    playerVars: { 
                        'playsinline': 1,
                        'controls': 0,
                        'disablekb': 1,
                        'fs': 0,
                        'modestbranding': 1,
                        'iv_load_policy': 3,
                        'cc_load_policy': 0,
                        'rel': 0,
                        'autoplay': 1
                    },
                    events: {
                        'onReady': () => { 
                            startLoopTracker(); 
                            if (transcriptSegments.length > 0) {
                                segmentStart = transcriptSegments[0].startTime;
                                segmentEnd = transcriptSegments[0].endTime;
                                player.seekTo(segmentStart, true);
                            }
                        }
                    }
                });
            } else {
                if (typeof player.loadVideoById === 'function') {
                    player.loadVideoById(videoId);
                }
            }
            isLooping = true;
        }

        function toggleLoopSegment() {
            isLooping = !isLooping;
            const btn = document.getElementById('loopBtn');
            const notice = document.getElementById('statusNotice');
            if (isLooping) {
                btn.innerText = "🛑 Tắt Lặp Câu (Đang Bật)";
                btn.style.backgroundColor = "#047857";
                notice.innerText = "💡 Đang khóa lặp mốc thời gian câu hiện tại!";
                let seg = transcriptSegments[currentSegmentIndex];
                if (seg) {
                    segmentStart = seg.startTime;
                    segmentEnd = seg.endTime;
                }
                if (player && typeof player.getCurrentTime === 'function') {
                    player.seekTo(segmentStart, true);
                }
            } else {
                btn.innerText = "🔁 Bật Lặp Câu (Auto)";
                btn.style.backgroundColor = "#059669";
                notice.innerText = "⚠️ Đã tắt lặp tự động.";
            }
        }

        function nextSegment() {
            if (currentSegmentIndex < transcriptSegments.length - 1) {
                currentSegmentIndex++;
            } else {
                currentSegmentIndex = 0;
            }
            updateSegmentUI();
        }

        function startLoopTracker() {
            setInterval(() => {
                if (player && typeof player.getPlayerState === 'function' && player.getPlayerState() === YT.PlayerState.PLAYING) {
                    let currentTime = player.getCurrentTime();
                    let seg = transcriptSegments[currentSegmentIndex];
                    if (seg) {
                        segmentStart = seg.startTime;
                        segmentEnd = seg.endTime;
                        
                        if (seg.isSilent) {
                            if (currentTime >= segmentEnd) {
                                nextSegment();
                            }
                            return;
                        }
                    }
                    
                    if (isLooping && segmentEnd > segmentStart && currentTime >= segmentEnd) {
                        player.seekTo(segmentStart, true);
                    }
                }
            }, 150);
        }

        function handleTextareaKey(event) {
            if (event.code === 'Enter' || event.key === 'Enter') {
                event.preventDefault();
                checkResult();
            }
        }

        function cleanText(text) {
            return text
                .toLowerCase()
                .replace(/[-•]/g, "")
                .replace(/[.,/#!$%^&*;:{}=\-_`~()?"']/g, "")
                .replace(/\s+/g, " ")
                .trim();
        }

        async function translateSegmentText(text) {
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=vi&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                let translatedString = "";
                if (data && data[0]) {
                    data[0].forEach(item => {
                        if (item[0]) translatedString += item[0];
                    });
                }
                return translatedString || "Đang dịch tự động...";
            } catch (e) {
                return "Bản dịch tiếng Việt tự động.";
            }
        }

        function toggleAnswerVisibility() {
            const container = document.getElementById('resultContainer');
            if (container.classList.contains('hidden')) {
                showResults(false);
            } else {
                container.classList.add('hidden');
            }
        }

        async function checkResult() {
            await showResults(true);
        }

        async function showResults(isSubmitting) {
            const container = document.getElementById('resultContainer');
            const diffOutput = document.getElementById('diffOutput');
            const scoreText = document.getElementById('scoreText');
            const translateOutput = document.getElementById('translateOutput');
            const notice = document.getElementById('statusNotice');

            let seg = transcriptSegments[currentSegmentIndex] || { text: "" };
            let currentRawSegment = seg.text;

            if (seg.isSilent) {
                diffOutput.innerText = "(Đoạn chuyển cảnh / Không thoại)";
                scoreText.innerText = "";
                translateOutput.innerText = "(Khoảng lặng)";
                container.classList.remove('hidden');
                return;
            }

            let targetClean = cleanText(currentRawSegment);
            let userClean = cleanText(document.getElementById('userInput').value);

            const originalWords = targetClean.split(' ').filter(w => w.length > 0);
            const userWords = userClean.split(' ').filter(w => w.length > 0);

            let matchCount = 0;
            originalWords.forEach((word, i) => {
                if (userWords[i] === word) {
                    matchCount++;
                }
            });

            let accuracy = originalWords.length > 0 ? Math.round((matchCount / originalWords.length) * 100) : 0;
            
            diffOutput.innerText = currentRawSegment;
            scoreText.innerText = `Độ chính xác: ${accuracy}% (Từ đúng: ${matchCount}/${originalWords.length})`;

            container.classList.remove('hidden');
            translateOutput.innerText = "Đang dịch tự động câu hiện tại...";
            
            let translated = await translateSegmentText(currentRawSegment);
            translateOutput.innerText = translated;

            if (isSubmitting) {
                if (accuracy === 100) {
                    isLooping = false;
                    const btn = document.getElementById('loopBtn');
                    btn.innerText = "🔁 Bật Lặp Câu (Auto)";
                    btn.style.backgroundColor = "#059669";
                    notice.innerHTML = "✅ <span class='text-emerald-700 font-bold'>Chính xác 100%!</span> Đã mở khóa. Bấm <span class='text-emerald-600 font-bold'>[⏭ Câu tiếp]</span> hoặc bấm Enter để sang đoạn tiếp theo!";
                    
                    setTimeout(() => {
                        if (currentView === 3) nextSegment();
                    }, 800);
                } else {
                    isLooping = true;
                    const btn = document.getElementById('loopBtn');
                    btn.innerText = "🛑 Tắt Lặp Câu (Đang Bật)";
                    btn.style.backgroundColor = "#047857";
                    notice.innerHTML = "❌ <span class='text-red-600 font-bold'>Chưa chính xác (" + accuracy + "%).</span> Vẫn tiếp tục lặp lại mốc thời gian này!";
                }
            }
        }
    </script>
</body>
</html>
