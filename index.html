<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeListen</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fbf8f5; }
        .correct { color: #047857; background-color: #d1fae5; padding: 0 2px; border-radius: 4px; }
        .incorrect { color: #b91c1c; background-color: #fee2e2; text-decoration: line-through; padding: 0 2px; border-radius: 4px; }
        
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 16px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-700">

    <!-- Header BeListen -->
    <header class="bg-white/85 backdrop-blur-md border-b border-pink-100 py-4 px-6 text-center shadow-xs sticky top-0 z-10">
        <h1 class="text-2xl font-extrabold tracking-wide" style="color: #db2777;">BeListen</h1>
        <p class="text-xs text-sky-600 mt-1 font-medium">Luyện tập nhiều hơn mỗi ngày, thành quả đang đến rồi đó!</p>
    </header>

    <!-- Main Content -->
    <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col gap-4">
        
        <!-- Chọn bài hoặc dán link YT -->
        <div class="bg-white p-4 rounded-2xl shadow-xs border border-pink-100/60 flex flex-col gap-3">
            <div>
                <label class="block text-xs font-bold mb-1 text-pink-500 uppercase tracking-wider">Chọn video luyện nghe:</label>
                <select id="lessonSelect" onchange="changeLesson()" class="w-full p-2.5 border border-sky-100 rounded-xl text-sm bg-sky-50/40 text-slate-700 focus:outline-none focus:border-sky-300">
                    <option value="5qap5aO4i9A">Bài 1: Lofi English Practice</option>
                    <option value="kJQP7kiw5Fk">Bài 2: Daily Conversation Practice</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold mb-1 text-sky-500 uppercase tracking-wider">Hoặc dán link YouTube cá nhân:</label>
                <div class="flex gap-2">
                    <input type="text" id="customUrlInput" placeholder="Dán link YT (vd: https://youtu.be/...)" class="w-full p-2.5 border border-pink-100 rounded-xl text-xs bg-pink-50/30 focus:outline-none focus:border-pink-300">
                    <button onclick="loadCustomVideo()" class="text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow-xs transition" style="background-color: #38bdf8;">Tải</button>
                </div>
            </div>
        </div>

        <!-- Khung phát YouTube & Điều khiển lặp ngắt câu -->
        <div class="bg-white p-4 rounded-2xl shadow-xs border border-pink-100/60 flex flex-col gap-3">
            <div id="playerContainer" class="video-container bg-slate-900 shadow-inner">
                <div id="player"></div>
            </div>

            <!-- Bảng điều khiển Lặp đoạn ngắt câu -->
            <div class="flex items-center justify-between gap-2 bg-pink-50/50 p-2.5 rounded-xl border border-pink-100">
                <button id="loopBtn" onclick="toggleLoopSegment()" class="flex-1 py-2 px-3 text-xs font-semibold rounded-lg text-white transition" style="background-color: #f472b6;">
                    🔁 Bật Lặp Câu (Auto)
                </button>
                <button onclick="nextSegment()" class="py-2 px-3 text-xs font-semibold rounded-lg bg-sky-400 text-white hover:bg-sky-500 transition">
                    ⏭ Câu tiếp
                </button>
            </div>
            <div id="statusNotice" class="text-center text-[11px] font-medium text-pink-600">💡 Chế độ lặp câu đang bật: Phải gõ đúng mới được qua câu mới!</div>
        </div>

        <!-- Khung nhập liệu (Chép chính tả) -->
        <div class="bg-white p-4 rounded-2xl shadow-xs border border-pink-100/60 flex-1 flex flex-col">
            <div class="flex justify-between items-center mb-2">
                <label class="text-xs font-bold uppercase tracking-wider text-pink-500">Gõ lại những gì bạn nghe được:</label>
                <button onclick="toggleAnswerVisibility()" class="text-xs text-sky-600 font-semibold hover:underline">Xem đáp án & Dịch</button>
            </div>
            
            <textarea id="userInput" rows="3" class="w-full p-3 border border-sky-100 rounded-xl text-sm bg-sky-50/20 focus:outline-none focus:border-sky-300 resize-none" placeholder="Nhập từ vựng nghe được vào đây..."></textarea>
            
            <!-- Nút kiểm tra Done -->
            <button onclick="checkResult()" class="mt-3 text-white py-2.5 rounded-xl text-sm font-bold shadow-xs transition" style="background-color: #38bdf8;">
                Done (Kiểm Tra & Nộp bài) ✓
            </button>
        </div>

        <!-- Khung đáp án đối chiếu & Dịch tiếng Việt (Ban đầu ẩn) -->
        <div id="resultContainer" class="bg-white p-4 rounded-2xl shadow-xs border border-sky-100 hidden flex flex-col gap-3">
            <div>
                <h3 class="text-xs font-bold uppercase tracking-wider mb-1" style="color: #db2777;">Đáp án đối chiếu:</h3>
                <div id="diffOutput" class="text-sm leading-relaxed font-mono p-3 rounded-xl border border-pink-100" style="background-color: #fdf2f8;"></div>
                <div id="scoreText" class="text-xs font-semibold mt-1 text-sky-600"></div>
            </div>

            <!-- Dịch Google Translate Tự Động -->
            <div class="border-t border-sky-100 pt-2">
                <h3 class="text-xs font-bold uppercase tracking-wider mb-1 text-sky-500">Dịch nghĩa (Google Translate):</h3>
                <div id="translateOutput" class="text-xs italic text-slate-600 p-2.5 rounded-xl bg-sky-50/50 border border-sky-100">
                    Đang nạp bản dịch...
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400">
        BeListen App ✨
    </footer>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const sampleData = {
            "5qap5aO4i9A": {
                text: "welcome to belisten daily English dictation practice keep trying your best every day",
                vi: "Chào mừng bạn đến với BeListen, hãy luyện chép chính tả tiếng Anh mỗi ngày và luôn cố gắng hết sức nhé!"
            },
            "kJQP7kiw5Fk": {
                text: "learning a new language requires patience and continuous effort",
                vi: "Học một ngôn ngữ mới đòi hỏi sự kiên nhẫn và nỗ lực liên tục."
            }
        };

        let player;
        let currentVideoId = "5qap5aO4i9A";
        let isLooping = true; // Mặc định bật lặp để ép luyện tập
        let segmentDuration = 6; // Độ dài mặc định của đoạn câu (giây)
        let segmentStart = 0;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: currentVideoId,
                playerVars: { 'playsinline': 1 },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            startLoopTracker();
        }

        function changeLesson() {
            currentVideoId = document.getElementById('lessonSelect').value;
            loadVideoById(currentVideoId);
        }

        function loadCustomVideo() {
            let rawUrl = document.getElementById('customUrlInput').value.trim();
            let videoId = "";

            if (rawUrl.includes("youtu.be/")) {
                videoId = rawUrl.split("youtu.be/")[1].split("?")[0];
            } else if (rawUrl.includes("watch?v=")) {
                videoId = rawUrl.split("watch?v=")[1].split("&")[0];
            } else {
                videoId = rawUrl;
            }

            if (videoId) {
                currentVideoId = videoId;
                sampleData[videoId] = {
                    text: "practice listening and dictation with your custom youtube audio",
                    vi: "Luyện nghe và chép chính tả với video YouTube cá nhân của bạn."
                };
                loadVideoById(videoId);
            } else {
                alert("Link YouTube chưa đúng định dạng!");
            }
        }

        function loadVideoById(id) {
            if (player && player.loadVideoById) {
                player.loadVideoById(id);
                document.getElementById('userInput').value = "";
                document.getElementById('resultContainer').classList.add('hidden');
                segmentStart = 0;
                isLooping = true;
                document.getElementById('loopBtn').innerText = "🛑 Tắt Lặp Câu";
                document.getElementById('loopBtn').style.backgroundColor = "#db2777";
                document.getElementById('statusNotice').innerText = "💡 Đang khóa lặp: Gõ đúng 100% mới được chuyển câu tiếp theo!";
            }
        }

        function toggleLoopSegment() {
            isLooping = !isLooping;
            const btn = document.getElementById('loopBtn');
            const notice = document.getElementById('statusNotice');
            if (isLooping) {
                btn.innerText = "🛑 Tắt Lặp Câu";
                btn.style.backgroundColor = "#db2777";
                notice.innerText = "💡 Đang khóa lặp: Gõ đúng 100% mới được chuyển câu tiếp theo!";
                if (player) segmentStart = player.getCurrentTime();
            } else {
                btn.innerText = "🔁 Bật Lặp Câu (Auto)";
                btn.style.backgroundColor = "#f472b6";
                notice.innerText = "⚠️ Đã tắt lặp tự động.";
            }
        }

        // Chuyển sang câu tiếp theo và dịch chuyển mốc thời gian đoạn lặp lên trước
        function nextSegment() {
            if (player) {
                segmentStart = player.getCurrentTime();
                segmentDuration = 6; // Đặt lại độ dài câu mới
                player.seekTo(segmentStart, true);
                player.playVideo();
                document.getElementById('userInput').value = "";
                document.getElementById('resultContainer').classList.add('hidden');
                isLooping = true;
                document.getElementById('loopBtn').innerText = "🛑 Tắt Lặp Câu";
                document.getElementById('loopBtn').style.backgroundColor = "#db2777";
                document.getElementById('statusNotice').innerText = "🎉 Đã mở khóa! Chuyển sang đoạn tiếp theo và tiếp tục luyện tập.";
            }
        }

        function startLoopTracker() {
            setInterval(() => {
                if (isLooping && player && player.getPlayerState() === YT.PlayerState.PLAYING) {
                    let currentTime = player.getCurrentTime();
                    if (currentTime - segmentStart >= segmentDuration) {
                        player.seekTo(segmentStart, true);
                    }
                }
            }, 400);
        }

        async function translateText(text) {
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=vi&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                return data[0][0][0];
            } catch (e) {
                return sampleData[currentVideoId]?.vi || "Bản dịch tiếng Việt tự động.";
            }
        }

        function toggleAnswerVisibility() {
            const container = document.getElementById('resultContainer');
            if (container.classList.contains('hidden')) {
                showResults(false);
            } else {
                container.classList.add('hidden');
            }
        }

        // Kiểm tra kết quả (Nút Done)
        async function checkResult() {
            await showResults(true);
        }

        async function showResults(isSubmitting) {
            const container = document.getElementById('resultContainer');
            const diffOutput = document.getElementById('diffOutput');
            const scoreText = document.getElementById('scoreText');
            const translateOutput = document.getElementById('translateOutput');
            const notice = document.getElementById('statusNotice');

            let currentData = sampleData[currentVideoId] || { text: "practice listening every day", vi: "Luyện nghe mỗi ngày." };
            let targetText = currentData.text.toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"");
            let userText = document.getElementById('userInput').value.toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"");

            const originalWords = targetText.split(/\s+/);
            const userWords = userText.split(/\s+/);

            let html = "";
            let matchCount = 0;

            originalWords.forEach((word, i) => {
                if (userWords[i] === word) {
                    html += `<span class="correct">${userWords[i] || word}</span> `;
                    matchCount++;
                } else if (userWords[i]) {
                    html += `<span class="incorrect">${userWords[i]}</span> <span class="correct">(${word})</span> `;
                } else {
                    html += `<span class="text-slate-400">(${word})</span> `;
                }
            });

            for (let i = originalWords.length; i < userWords.length; i++) {
                html += `<span class="incorrect">${userWords[i]}</span> `;
            }

            diffOutput.innerHTML = html;
            let accuracy = Math.round((matchCount / originalWords.length) * 100);
            scoreText.innerText = `Độ chính xác: ${accuracy}% (Từ đúng: ${matchCount}/${originalWords.length})`;

            container.classList.remove('hidden');
            translateOutput.innerText = "Đang dịch tự động qua Google Translate...";
            let translated = await translateText(currentData.text);
            translateOutput.innerText = translated;

            // Xử lý logic khóa / mở vòng lặp khi bấm Done
            if (isSubmitting) {
                if (accuracy === 100) {
                    isLooping = false; // Mở khóa vòng lặp để qua câu mới
                    document.getElementById('loopBtn').innerText = "🔁 Bật Lặp Câu (Auto)";
                    document.getElementById('loopBtn').style.backgroundColor = "#f472b6";
                    notice.innerHTML = "✅ <span class='text-emerald-600 font-bold'>Chính xác 100%!</span> Đã mở khóa. Hãy bấm nút <span class='text-sky-600 font-bold'>[⏭ Câu tiếp]</span> để sang đoạn tiếp theo!";
                } else {
                    isLooping = true; // Tiếp tục lặp lại đoạn cũ vì chưa đúng
                    document.getElementById('loopBtn').innerText = "🛑 Tắt Lặp Câu";
                    document.getElementById('loopBtn').style.backgroundColor = "#db2777";
                    notice.innerHTML = "❌ <span class='text-red-500 font-bold'>Chưa chính xác (" + accuracy + "%).</span> Vẫn tiếp tục lặp lại câu này để bạn luyện gõ lại cho đúng!";
                }
            }
        }
    </script>
</body>
</html>
