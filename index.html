<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Dictation - Pastel Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tùy chỉnh màu nền chủ đạo là màu kem ấm áp */
        body {
            background-color: #fbf8f5;
        }
        .correct { color: #047857; background-color: #d1fae5; padding: 0 2px; border-radius: 4px; }
        .incorrect { color: #b91c1c; background-color: #fee2e2; text-decoration: line-through; padding: 0 2px; border-radius: 4px; }
        
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 16px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-700">

    <!-- Header với điểm nhấn Hồng & Xanh pastel -->
    <header class="bg-white/80 backdrop-blur-md border-b border-pink-100 py-4 px-6 text-center shadow-xs sticky top-0 z-10">
        <h1 class="text-xl font-bold tracking-wide" style="color: #db2777;">🎧 YT Dictation</h1>
        <p class="text-xs text-sky-600 mt-0.5 font-medium">Luyện nghe chép chính tả • Pastel Style</p>
    </header>

    <!-- Main Content -->
    <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col gap-4">
        
        <!-- Chọn video mẫu hoặc tự dán link -->
        <div class="bg-white p-4 rounded-2xl shadow-xs border border-pink-100/60 flex flex-col gap-3">
            <div>
                <label class="block text-xs font-bold mb-1 text-pink-500 uppercase tracking-wider">Chọn video mẫu sẵn có:</label>
                <select id="lessonSelect" onchange="changeLesson()" class="w-full p-2.5 border border-sky-100 rounded-xl text-sm bg-sky-50/40 text-slate-700 focus:outline-none focus:border-sky-300">
                    <option value="https://www.youtube.com/embed/5qap5aO4i9A">Bài 1: Lofi Beats (Thư giãn)</option>
                    <option value="https://www.youtube.com/embed/kJQP7kiw5Fk">Bài 2: Despacito (Luyện nghe nhạc)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold mb-1 text-sky-500 uppercase tracking-wider">Hoặc dán link YouTube bất kỳ:</label>
                <div class="flex gap-2">
                    <input type="text" id="customUrlInput" placeholder="Dán link YT (vd: https://youtu.be/...)" class="w-full p-2.5 border border-pink-100 rounded-xl text-xs bg-pink-50/30 focus:outline-none focus:border-pink-300">
                    <button onclick="loadCustomVideo()" class="text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow-xs transition" style="background-color: #38bdf8; hover:background-color: #0ea5e9;">Tải</button>
                </div>
            </div>
        </div>

        <!-- Khung phát YouTube Player -->
        <div class="bg-white p-4 rounded-2xl shadow-xs border border-pink-100/60 flex flex-col gap-2">
            <div class="video-container bg-slate-900 shadow-inner">
                <iframe id="ytPlayer" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="text-center text-xs text-sky-600 font-medium mt-1">💡 Nghe đoạn ngắn trên video rồi tạm dừng để gõ lại nhé</div>
        </div>

        <!-- Khung nhập liệu (Chép chính tả) -->
        <div class="bg-white p-4 rounded-2xl shadow-xs border border-pink-100/60 flex-1 flex flex-col">
            <div class="flex justify-between items-center mb-2">
                <label class="text-xs font-bold uppercase tracking-wider text-pink-500">Gõ lại câu bạn vừa nghe:</label>
                <button onclick="toggleTranscript()" class="text-xs text-sky-600 font-semibold hover:underline">Xem đáp án mẫu</button>
            </div>
            
            <textarea id="userInput" rows="3" class="w-full p-3 border border-sky-100 rounded-xl text-sm bg-sky-50/20 focus:outline-none focus:border-sky-300 resize-none" placeholder="Nhập phần bạn nghe vào đây..."></textarea>
            
            <!-- Khung ẩn hiện đáp án mẫu -->
            <div id="transcriptBox" class="hidden mt-2 p-3 rounded-xl text-xs text-slate-600 italic border border-pink-100" style="background-color: #fdf2f8;">
                <span class="font-bold text-pink-600">Đáp án mẫu:</span> <span id="sampleTranscript">Luyện nghe tập trung và ghi chép lại từng từ vựng mới mỗi ngày.</span>
            </div>

            <button onclick="checkResult()" class="mt-3 text-white py-2.5 rounded-xl text-sm font-semibold shadow-sm transition" style="background-color: #f472b6;">
                Kiểm tra kết quả ✓
            </button>
        </div>

        <!-- Kết quả hiển thị -->
        <div id="resultContainer" class="bg-white p-4 rounded-2xl shadow-xs border border-sky-100 hidden">
            <h3 class="text-xs font-bold uppercase tracking-wider mb-1" style="color: #38bdf8;">Kết quả so sánh:</h3>
            <div id="diffOutput" class="text-sm leading-relaxed font-mono p-3 rounded-xl border border-sky-50" style="background-color: #f0f9ff;"></div>
            <div id="scoreText" class="text-xs font-semibold mt-2 text-pink-600"></div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400">
        Pastel Dictation App ✨
    </footer>

    <script>
        const sampleData = {
            "https://www.youtube.com/embed/5qap5aO4i9A": "lofi hip hop radio beats to relax study to",
            "https://www.youtube.com/embed/kJQP7kiw5Fk": "despacito luis fonsi dandy yankee"
        };

        let ytPlayer = document.getElementById('ytPlayer');
        let lessonSelect = document.getElementById('lessonSelect');
        let customUrlInput = document.getElementById('customUrlInput');
        let userInput = document.getElementById('userInput');
        let resultContainer = document.getElementById('resultContainer');
        let diffOutput = document.getElementById('diffOutput');
        let scoreText = document.getElementById('scoreText');
        let transcriptBox = document.getElementById('transcriptBox');
        let sampleTranscript = document.getElementById('sampleTranscript');

        function initPlayer(url) {
            ytPlayer.src = url;
            userInput.value = "";
            resultContainer.classList.add('hidden');
            transcriptBox.classList.add('hidden');
            sampleTranscript.innerText = sampleData[url] || "hãy tự luyện nghe đoạn audio này và gõ lại nội dung nhé.";
        }

        initPlayer(lessonSelect.value);

        function changeLesson() {
            initPlayer(lessonSelect.value);
        }

        function loadCustomVideo() {
            let rawUrl = customUrlInput.value.trim();
            let embedUrl = "";

            if (rawUrl.includes("youtu.be/")) {
                let videoId = rawUrl.split("youtu.be/")[1].split("?")[0];
                embedUrl = `https://www.youtube.com/embed/${videoId}`;
            } else if (rawUrl.includes("watch?v=")) {
                let videoId = rawUrl.split("watch?v=")[1].split("&")[0];
                embedUrl = `https://www.youtube.com/embed/${videoId}`;
            } else if (rawUrl.includes("embed/")) {
                embedUrl = rawUrl;
            }

            if (embedUrl) {
                sampleData[embedUrl] = "bài tập tự luyện từ link youtube cá nhân của bạn";
                initPlayer(embedUrl);
            } else {
                alert("Link YouTube chưa đúng định dạng, bạn thử lại nhé!");
            }
        }

        function toggleTranscript() {
            transcriptBox.classList.toggle('hidden');
        }

        function checkResult() {
            let currentUrl = ytPlayer.src;
            let targetText = (sampleData[currentUrl] || "").toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"");
            let userText = userInput.value.toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"");

            if (!targetText || targetText === "bài tập tự luyện từ link youtube cá nhân của bạn") {
                resultContainer.classList.remove('hidden');
                diffOutput.innerHTML = `<span class="text-slate-600">${userInput.value}</span>`;
                scoreText.innerText = "Đã ghi nhận phần gõ của bạn!";
                return;
            }

            const originalWords = targetText.split(/\s+/);
            const userWords = userText.split(/\s+/);

            let html = "";
            let matchCount = 0;

            originalWords.forEach((word, i) => {
                if (userWords[i] === word) {
                    html += `<span class="correct">${userWords[i] || word}</span> `;
                    matchCount++;
                } else if (userWords[i]) {
                    html += `<span class="incorrect">${userWords[i]}</span> <span class="correct">(${word})</span> `;
                } else {
                    html += `<span class="text-slate-300">(${word})</span> `;
                }
            });

            for (let i = originalWords.length; i < userWords.length; i++) {
                html += `<span class="incorrect">${userWords[i]}</span> `;
            }

            diffOutput.innerHTML = html;
            let accuracy = Math.round((matchCount / originalWords.length) * 100);
            scoreText.innerText = `Độ chính xác: ${accuracy}% (Đúng: ${matchCount}/${originalWords.length})`;
            resultContainer.classList.remove('hidden');
        }
    </script>
</body>
</html>
